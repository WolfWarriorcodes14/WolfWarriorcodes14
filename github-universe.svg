    <text x="30" y="45" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">LeetCode Journey</text>
    <text x="30" y="80" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#ff9d4d">230+</text>
    <text x="30" y="98" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#a7a3d1">Problems solved</text>
    <text x="170" y="80" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#2cb1bc">1536</text>
    <text x="170" y="98" font-family="Verdana, Arial, sans-serif" font-size="12" fill="#a7a3d1">Contest rating</text>
