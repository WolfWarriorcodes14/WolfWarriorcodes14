        <rect x="112" y="16" width="12" height="12" rx="2"/>
      </g>
      <g fill="#ff5da2" filter="url(#glow)">
        <rect x="144" y="16" width="12" height="12" rx="2"/><rect x="160" y="16" width="12" height="12" rx="2"/><rect x="176" y="16" width="12" height="12" rx="2"/>
        <rect x="144" y="32" width="12" height="12" rx="2"/>
      </g>
      <g fill="#2a2360">
        <rect x="192" y="0" width="12" height="12" rx="2"/><rect x="208" y="0" width="12" height="12" rx="2"/><rect x="224" y="0" width="12" height="12" rx="2"/>
        <rect x="192" y="16" width="12" height="12" rx="2"/><rect x="208" y="16" width="12" height="12" rx="2"/><rect x="224" y="16" width="12" height="12" rx="2"/>
        <rect x="192" y="32" width="12" height="12" rx="2"/><rect x="208" y="32" width="12" height="12" rx="2"/><rect x="224" y="32" width="12" height="12" rx="2"/>
      </g>
    </g>
    <text x="0" y="80" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#736ba8">a snapshot of recent activity - the live, always-updating version runs below as the contribution snake</text>
  </g>

