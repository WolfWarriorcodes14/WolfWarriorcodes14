      <circle cx="45" cy="85" r="5" fill="#2cb1bc"/><text x="58" y="89">Docker &amp; AWS</text>
      <circle cx="45" cy="110" r="5" fill="#ff5da2"/><text x="58" y="114">Backend Development</text>
      <circle cx="230" cy="60" r="5" fill="#ff9d4d"/><text x="243" y="64">MERN Stack</text>
      <circle cx="230" cy="85" r="5" fill="#7f5af0"/><text x="243" y="89">C++ / Java / Python</text>
      <circle cx="230" cy="110" r="5" fill="#2cb1bc"/><text x="243" y="114">Problem Solving</text>
