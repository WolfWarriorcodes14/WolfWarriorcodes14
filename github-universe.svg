      <circle cx="90" cy="35" r="4" fill="#7f5af0"/><text x="103" y="39">Java</text>
      <circle cx="170" cy="35" r="4" fill="#7f5af0"/><text x="183" y="39">Python</text>
      <circle cx="260" cy="35" r="4" fill="#7f5af0"/><text x="273" y="39">JavaScript</text>

      <circle cx="15" cy="65" r="4" fill="#2cb1bc"/><text x="28" y="69">React</text>
      <circle cx="90" cy="65" r="4" fill="#2cb1bc"/><text x="103" y="69">Redux</text>
      <circle cx="180" cy="65" r="4" fill="#2cb1bc"/><text x="193" y="69">Tailwind</text>
      <circle cx="285" cy="65" r="4" fill="#2cb1bc"/><text x="298" y="69">Node.js</text>

      <circle cx="15" cy="95" r="4" fill="#ff5da2"/><text x="28" y="99">Express</text>
      <circle cx="100" cy="95" r="4" fill="#ff5da2"/><text x="113" y="99">MongoDB</text>
      <circle cx="200" cy="95" r="4" fill="#ff5da2"/><text x="213" y="99">MySQL</text>
      <circle cx="280" cy="95" r="4" fill="#ff5da2"/><text x="293" y="99">Docker</text>

      <circle cx="15" cy="125" r="4" fill="#ff9d4d"/><text x="28" y="129">AWS</text>
      <circle cx="90" cy="125" r="4" fill="#ff9d4d"/><text x="103" y="129">Git</text>
      <circle cx="150" cy="125" r="4" fill="#ff9d4d"/><text x="163" y="129">GitHub</text>
      <circle cx="240" cy="125" r="4" fill="#ff9d4d"/><text x="253" y="129">Postman</text>
