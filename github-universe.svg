<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b1440"/>
      <stop offset="55%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#060614"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221c4a"/>
      <stop offset="100%" stop-color="#150f36"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#2cb1bc"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5da2"/>
      <stop offset="100%" stop-color="#ff9d4d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#bgGlow)"/>

  <g fill="#ffffff" opacity="0.55">
    <circle cx="60" cy="40" r="1.4"/><circle cx="140" cy="90" r="1"/><circle cx="220" cy="35" r="1.6"/>
    <circle cx="310" cy="70" r="1.1"/><circle cx="410" cy="30" r="1.3"/><circle cx="500" cy="60" r="1"/>
    <circle cx="600" cy="25" r="1.5"/><circle cx="700" cy="55" r="1.1"/><circle cx="800" cy="35" r="1.3"/>
    <circle cx="900" cy="70" r="1"/><circle cx="990" cy="30" r="1.5"/><circle cx="1080" cy="60" r="1.1"/>
    <circle cx="1150" cy="40" r="1.4"/><circle cx="90" cy="580" r="1.2"/><circle cx="200" cy="610" r="1"/>
    <circle cx="1000" cy="600" r="1.3"/><circle cx="1100" cy="570" r="1"/><circle cx="350" cy="600" r="1.1"/>
    <circle cx="700" cy="615" r="1.4"/><circle cx="500" cy="590" r="1"/>
  </g>

  <text x="600" y="72" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" filter="url(#glow)">GitHub Universe</text>
  <text x="600" y="102" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a7a3d1">a constellation of code, streaks and solved problems</text>

  <g transform="translate(70,140)">
