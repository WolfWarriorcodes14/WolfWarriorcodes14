    <rect x="30" y="115" width="150" height="8" rx="4" fill="url(#accentB)"/>
    <text x="30" y="140" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#a7a3d1">Top 35% globally</text>
  </g>

  <g transform="translate(710,140)">
