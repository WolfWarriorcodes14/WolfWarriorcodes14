      <g fill="#2a2360">
        <rect x="0" y="0" width="12" height="12" rx="2"/><rect x="16" y="0" width="12" height="12" rx="2"/><rect x="32" y="0" width="12" height="12" rx="2"/>
        <rect x="48" y="0" width="12" height="12" rx="2"/><rect x="64" y="0" width="12" height="12" rx="2"/><rect x="80" y="0" width="12" height="12" rx="2"/>
        <rect x="0" y="16" width="12" height="12" rx="2"/><rect x="16" y="16" width="12" height="12" rx="2"/><rect x="32" y="16" width="12" height="12" rx="2"/>
        <rect x="48" y="16" width="12" height="12" rx="2"/><rect x="64" y="16" width="12" height="12" rx="2"/><rect x="80" y="16" width="12" height="12" rx="2"/>
      </g>
      <g fill="#7f5af0" filter="url(#glow)">
