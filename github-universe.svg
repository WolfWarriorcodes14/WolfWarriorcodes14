    <circle cx="245" cy="35" r="26" fill="none" stroke="url(#accentA)" stroke-width="5" filter="url(#glow)"/>
    <text x="245" y="41" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text>
    <text x="30" y="55" font-family="Verdana, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">55</text>
    <text x="30" y="80" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#a7a3d1">Total contributions</text>
    <text x="30" y="120" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#7f5af0">Longest streak: 5 days</text>
    <text x="30" y="140" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#736ba8">Sep 2024 - Present</text>
  </g>

  <g transform="translate(390,140)">
